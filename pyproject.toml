[project]
name = "eu-health-workforce-platform"
version = "0.1.0"
description = "EU Healthcare Workforce Crisis Analytics & Forecasting Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ml = [
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "xgboost>=2.0",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
    "folium>=0.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Could not infer format:UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]