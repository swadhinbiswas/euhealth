<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="EU Healthcare Workforce Platform mascot">
  <defs>
    <radialGradient id="faceBg" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8eafa"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf3f4"/>
      <stop offset="100%" stop-color="#fbe9ec"/>
    </linearGradient>
    <linearGradient id="crossG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c62e47"/>
      <stop offset="100%" stop-color="#9c1f34"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="110" cy="196" rx="52" ry="8" fill="#1F4E79" opacity="0.14"/>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0" dur="3s" repeatCount="indefinite"/>

    <!-- halo badge -->
    <circle cx="110" cy="108" r="80" fill="url(#halo)" stroke="#1F4E79" stroke-width="3"/>

    <!-- head -->
    <circle cx="110" cy="108" r="66" fill="url(#faceBg)" stroke="#1F4E79" stroke-width="5"/>

    <!-- nurse cap -->
    <g>
      <path d="M 60 74 Q 110 44 160 74 L 154 92 Q 110 68 66 92 Z"
            fill="#ffffff" stroke="#1F4E79" stroke-width="4" stroke-linejoin="round"/>
      <rect x="101" y="58" width="18" height="18" rx="4" fill="url(#crossG)"/>
      <rect x="97" y="62" width="26" height="10" rx="4" fill="url(#crossG)"/>
    </g>

    <!-- eyes (blink) -->
    <g fill="#243040">
      <circle cx="88" cy="106" r="7">
        <animate attributeName="ry" values="7;1.2;7" dur="4.2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="132" cy="106" r="7">
        <animate attributeName="ry" values="7;1.2;7" dur="4.2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="85" cy="103" r="2.2" fill="#fff"/>
    <circle cx="129" cy="103" r="2.2" fill="#fff"/>

    <!-- cheeks -->
    <circle cx="74" cy="122" r="7" fill="#a4243b" opacity="0.2"/>
    <circle cx="146" cy="122" r="7" fill="#a4243b" opacity="0.2"/>

    <!-- smile -->
    <path d="M 92 124 Q 110 139 128 124" fill="none" stroke="#243040"
          stroke-width="4.5" stroke-linecap="round"/>

    <!-- pulsing red cross medallion -->
    <g transform="translate(110,150)">
      <circle r="19" fill="#fff" stroke="#a4243b" stroke-width="3"/>
      <g fill="url(#crossG)">
        <rect x="-4.5" y="-13" width="9" height="26" rx="3"/>
        <rect x="-13" y="-4.5" width="26" height="9" rx="3"/>
        <animate attributeName="transform" type="scale" values="1;1.12;1" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- little wave hand -->
    <g transform="translate(160,128)">
      <circle r="12" fill="#d8eafa" stroke="#1F4E79" stroke-width="3"/>
      <path d="M -5 0 q 5 8 10 0 M -2 -6 q 2 6 4 0" fill="none" stroke="#1F4E79" stroke-width="2.5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-15 0 0; 18 0 0; -15 0 0" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
