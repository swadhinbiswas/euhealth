<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Mascot">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0f8"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="104" r="70" fill="url(#g)" stroke="#1F4E79" stroke-width="3">
    <animate attributeName="r" values="70;74;70;70" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- hospital cross -->
  <g transform="translate(100,94)">
    <rect x="-24" y="-9" width="48" height="18" rx="4" fill="#A4243B"/>
    <rect x="-9" y="-24" width="18" height="48" rx="4" fill="#A4243B"/>
  </g>
  <!-- face -->
  <circle cx="76" cy="140" r="5" fill="#3A4454">
    <animate attributeName="ry" values="5;0.6;5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="124" cy="140" r="5" fill="#3A4454">
    <animate attributeName="ry" values="5;0.6;5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M 84 156 Q 100 166 116 156" fill="none" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
</svg>